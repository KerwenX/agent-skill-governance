<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillOS · 智能体技能双端协同治理平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="flex items-center justify-center p-4">

<div class="stage">

    <!-- ==================== 顶栏 ==================== -->
    <header class="h-[56px] shrink-0 bg-slate-900 text-white flex items-center justify-between px-5">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-indigo-500/25 border border-indigo-400/40 flex items-center justify-center">
                <svg class="w-5 h-5 text-indigo-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
            <div class="leading-tight">
                <p class="text-[16px] font-bold tracking-wide">SkillOS</p>
                <p class="text-[11px] text-slate-400 -mt-0.5">智能体技能双端协同治理平台</p>
            </div>
        </div>

        <!-- 端切换 -->
        <div class="flex items-center gap-1 bg-slate-800 rounded-lg p-1 border border-slate-700">
            <button id="tab-user" class="press px-4 py-1.5 rounded-md text-[13px] font-semibold text-white bg-indigo-600">
                <span class="flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    用户端
                </span>
            </button>
            <button id="tab-dev" class="press px-4 py-1.5 rounded-md text-[13px] font-semibold text-slate-300">
                <span class="flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    开发者端
                </span>
            </button>
        </div>

        <div class="flex items-center gap-2">
            <button id="btn-reset" class="press text-[12px] text-slate-300 hover:text-white flex items-center gap-1 px-2 py-1 rounded-md hover:bg-slate-800">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                重置演示
            </button>
            <button id="hdr-gcv" class="hit flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-[12px]">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span class="text-slate-300">全局契约</span>
                <b id="gcv-ver" class="mono text-indigo-300">GC_G^1</b>
                <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <button id="hdr-notif" class="hit relative">
                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span id="notif-dot" class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-red-500 hidden"></span>
            </button>
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-400 to-violet-500 flex items-center justify-center text-white text-[12px] font-bold">林</div>
        </div>
    </header>

    <!-- ==================== 子模块 tab ==================== -->
    <div id="sub-tabs" class="shrink-0 flex items-center gap-1 px-5 h-[44px] bg-white border-b border-slate-100 overflow-x-auto scroll-thin"></div>

    <!-- ==================== 视图容器 ==================== -->
    <div id="view" class="relative flex-1 min-h-0 overflow-hidden bg-slate-50/40"></div>

    <!-- 方向提示浮层 -->
    <div id="dir-overlay" class="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
        <div id="dir-pill" class="bg-slate-900/90 text-white rounded-2xl px-6 py-4 text-center shadow-2xl opacity-0">
            <svg id="dir-icon" class="w-7 h-7 mx-auto mb-1.5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 17L17 7M17 7H8M17 7v9"></path></svg>
            <p class="text-[15px] font-bold" id="dir-text">证据上行</p>
            <p class="text-[11px] text-slate-400 mt-0.5" id="dir-sub">User → Developer</p>
        </div>
    </div>
</div>

<!-- ==================== 抽屉 ==================== -->
<div id="drawer-mask" class="fixed inset-0 bg-slate-900/25 hidden z-40" onclick="closeDrawer()"></div>
<aside id="drawer" class="drawer fixed top-0 right-0 h-full w-[380px] max-w-[92vw] bg-white shadow-2xl z-50 translate-x-full flex flex-col">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
        <h3 class="text-[16px] font-bold text-slate-800" id="drawer-title">详情</h3>
        <button class="hit w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center" onclick="closeDrawer()">
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    <div class="flex-1 min-h-0 overflow-y-auto scroll-thin p-4" id="drawer-body"></div>
</aside>

<!-- ==================== 弹窗 ==================== -->
<div id="modal-mask" class="fixed inset-0 bg-slate-900/30 hidden z-[55] flex items-center justify-center p-4" onclick="closeModal()"></div>
<div id="modal" class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[460px] max-w-[94vw] bg-white rounded-2xl shadow-2xl z-[60] hidden pop-in">
    <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-100">
        <h3 class="text-[16px] font-bold text-slate-800" id="modal-title">标题</h3>
        <button class="hit w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center" onclick="closeModal()">
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    <div class="p-5 max-h-[60vh] overflow-y-auto scroll-thin" id="modal-body"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
